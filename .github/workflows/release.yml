name: Release

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  check-version:
    name: Check for version change
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
          # For workflow_run, checkout the commit from the test workflow
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify commit was tested
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          # For workflow_run trigger, check that the triggering workflow succeeded
          if [ "${{ github.event_name }}" == "workflow_run" ] && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "::error::Test workflow did not succeed (conclusion: ${{ github.event.workflow_run.conclusion }})"
            exit 1
          fi
          # Also verify the tested tag exists
          if ! git tag --list "tested-${COMMIT_SHA}" | grep -q .; then
            echo "::error::Commit ${COMMIT_SHA} has not been tested. Waiting for test workflow to complete."
            exit 1
          fi
          echo "Commit ${COMMIT_SHA} has passed tests."

      - name: Check whether a release already exists for this version
        id: check
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Cargo.toml version: $VERSION"

          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — skipping release"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "No release for v$VERSION — will create one"
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  create-release:
    name: Create Release
    needs: [check-version]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ needs.check-version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ needs.check-version.outputs.version }}
          git push origin v${{ needs.check-version.outputs.version }}

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          release_name: Release v${{ needs.check-version.outputs.version }}
          draft: false
          prerelease: false

  build-and-upload:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            package_types: macos
            artifact: stargate-macos-aarch64.tar.gz
            content_type: application/gzip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package_types: appimage
            artifact: stargate-linux-x86_64.AppImage
            content_type: application/octet-stream
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package_types: nsis
            artifact: stargate-windows-x86_64-setup.exe
            content_type: application/octet-stream

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dioxus CLI
        run: |
          DX_VERSION="v0.7.3"
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            curl -fL https://github.com/DioxusLabs/dioxus/releases/download/${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz | tar xz
            sudo mv dx /usr/local/bin/
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            curl -fL https://github.com/DioxusLabs/dioxus/releases/download/${DX_VERSION}/dx-aarch64-apple-darwin.tar.gz | tar xz
            sudo mv dx /usr/local/bin/
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            curl -fL https://github.com/DioxusLabs/dioxus/releases/download/${DX_VERSION}/dx-x86_64-pc-windows-msvc.zip -o dx.zip
            unzip dx.zip
            mv dx.exe C:/Windows/System32/
          fi
        shell: bash

      - name: Install Linux dependencies (cached)
        if: matrix.os == 'ubuntu-latest'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
          version: 1.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Bundle with Dioxus CLI
        # dx bundle (unlike dx build) does platform packaging and embeds the app
        # icon from [bundle] icon in Dioxus.toml — the .icns into the macOS .app,
        # the .ico into the Windows installer/exe, and a .desktop + icon into the
        # Linux AppImage. No manual icon handling needed.
        env:
          # linuxdeploy/appimagetool are themselves AppImages and need FUSE to
          # mount, which GitHub's ubuntu runners lack. This makes them self-extract
          # instead, avoiding FUSE entirely. No-op on macOS/Windows.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: dx bundle --release --platform desktop --package-types ${{ matrix.package_types }}
        shell: bash

      - name: Sign macOS app (ad-hoc)
        if: startsWith(matrix.os, 'macos')
        run: |
          # Ad-hoc sign the bundled .app to prevent the "damaged" Gatekeeper message.
          APP=$(find target/dx/stargate/bundle -ipath '*macos*' -name 'Stargate.app' | head -1)
          codesign --force --deep --sign - "$APP"
        shell: bash

      - name: Prepare artifact
        run: |
          mkdir -p release-artifacts
          if [[ "${{ matrix.os }}" == macos* ]]; then
            # Package the signed .app as a tarball (preserves the bundle layout).
            APP=$(find target/dx/stargate/bundle -ipath '*macos*' -name 'Stargate.app' | head -1)
            tar -C "$(dirname "$APP")" -czf "release-artifacts/${{ matrix.artifact }}" Stargate.app
          elif [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            cp "$(find target/dx/stargate/bundle -iname '*.AppImage' | head -1)" "release-artifacts/${{ matrix.artifact }}"
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            cp "$(find target/dx/stargate/bundle -ipath '*nsis*' -name '*.exe' | head -1)" "release-artifacts/${{ matrix.artifact }}"
          fi
        shell: bash

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./release-artifacts/${{ matrix.artifact }}
          asset_name: ${{ matrix.artifact }}
          asset_content_type: ${{ matrix.content_type }}
