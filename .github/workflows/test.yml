name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        lfs: true
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Install Linux dependencies (cached)
      uses: awalsh128/cache-apt-pkgs-action@latest
      with:
        packages: pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
        version: 1.0
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
    - name: Build
      run: cargo build --verbose --release
    - name: Run tests
      run: cargo test --verbose --release

    - name: Tag commit as tested
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -f "tested-${{ github.sha }}"
        git push origin "tested-${{ github.sha }}" --force
