[package]
name = "stargate"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "=0.7.3", features = ["desktop", "router"] }
dioxus-free-icons = { version = "0.10", features = ["lucide"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures = "0.3"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
http = "1"
rfd = "0.15"
chrono = "0.4"
open = "5"
blake3 = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
