<!doctype html>
<!-- Social share card template (1200x630), rendered by scripts/render_og.py.
     Placeholders: __ORBIT__, __EYEBROW__, __HEADLINE__, __FOOTER__. Matches the site's paper/graphite theme. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Inter'; font-weight: 300 600; src: url('inter-latin.woff2') format('woff2'); }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fafafa; }
  .frame {
    position: absolute; inset: 40px; border: 1px solid #e8e8e8;
    display: flex; flex-direction: column; padding: 56px 56px 46px;
    font-family: 'Inter', sans-serif; color: #171717;
  }
  .brand { display: flex; align-items: center; gap: 24px; font-size: 30px; font-weight: 600; letter-spacing: -0.5px; }
  .brand svg { width: 60px; height: 60px; }
  .body { margin-top: auto; }
  .eyebrow { font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 20px; letter-spacing: 4px; color: #8a8a8a; text-transform: uppercase; }
  h1 { margin: 18px 0 0; font-size: 68px; line-height: 1.08; font-weight: 600; letter-spacing: -2px; max-width: 1000px; }
  .footer { margin-top: 34px; font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 18px; color: #525252; }
</style>
</head>
<body>
  <div class="frame">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">__ORBIT__</svg>
      <span>Stargate</span>
    </div>
    <div class="body">
      <div class="eyebrow">__EYEBROW__</div>
      <h1 id="headline">__HEADLINE__</h1>
      <div class="footer">__FOOTER__</div>
    </div>
  </div>
  <script>
    // Shrink long headlines until the card content fits inside the frame.
    (async function () {
      await document.fonts.ready;
      var h = document.getElementById('headline'), frame = document.querySelector('.frame'), size = 68;
      while (frame.scrollHeight > frame.clientHeight && size > 40) { size -= 2; h.style.fontSize = size + 'px'; }
      document.body.setAttribute('data-ready', '1');
    })();
  </script>
</body>
</html>
