<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Social share card, matches the app's paper/graphite theme. -->
  <rect width="1200" height="630" fill="#fafafa"/>
  <!-- hairline frame -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#e8e8e8" stroke-width="1"/>

  <!-- logo: orbit icon directly, black on paper, no background -->
  <g transform="translate(96,96)">
    <g transform="translate(0,2) scale(2.5)" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <circle cx="19" cy="5" r="2"/>
      <circle cx="5" cy="19" r="2"/>
      <path d="M10.4 21.9a10 10 0 0 0 9.941-15.416"/>
      <path d="M13.5 2.1a10 10 0 0 0-9.841 15.416"/>
    </g>
    <text x="84" y="44" font-family="'Inter',sans-serif" font-size="30" font-weight="600" fill="#171717">Stargate</text>
  </g>

  <!-- eyebrow -->
  <text x="96" y="312" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="20" letter-spacing="4" fill="#8a8a8a">DESKTOP CLIENT · SPACETIMEDB</text>

  <!-- headline -->
  <text x="92" y="392" font-family="'Inter',sans-serif" font-size="68" font-weight="600" fill="#171717" letter-spacing="-2">The native GUI for</text>
  <text x="92" y="468" font-family="'Inter',sans-serif" font-size="68" font-weight="600" fill="#171717" letter-spacing="-2">SpacetimeDB.</text>

  <!-- footer line -->
  <text x="96" y="556" font-family="ui-monospace,'SFMono-Regular',Menlo,monospace" font-size="18" fill="#525252">macOS · Windows · Linux</text>
</svg>
